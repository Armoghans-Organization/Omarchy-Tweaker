{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <!-- SEO -->
  <meta name="author" content="Armoghan-ul-Mohmin">
  <meta name="description" content="Omarchy Tweaker - Personal Omarchy customization and automation toolkit.">

  <!-- Theme color -->
  <meta name="theme-color" content="#7c3aed">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Omarchy Tweaker">
  <meta property="og:title" content="{{ page.title }} - Omarchy Tweaker">
  <meta property="og:description" content="Personal Omarchy customization and automation toolkit.">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="https://armoghans-organization.github.io/Omarchy-Tweaker/assets/images/social-preview.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} - Omarchy Tweaker">
  <meta name="twitter:description" content="Personal Omarchy customization and automation toolkit.">
  <meta name="twitter:image" content="https://armoghans-organization.github.io/Omarchy-Tweaker/assets/images/social-preview.png">


  <!-- Favicons  -->
  <link rel="icon" type="image/x-icon" href="{{ 'favicons/favicon.ico' | url }}">

  <link rel="icon" type="image/png" sizes="16x16" href="{{ 'favicons/favicon-16x16.png' | url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ 'favicons/favicon-32x32.png' | url }}">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ 'favicons/favicon-48x48.png' | url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ 'favicons/favicon-192x192.png' | url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ 'favicons/favicon-512x512.png' | url }}">

  <link rel="apple-touch-icon" href="{{ 'favicons/apple-touch-icon.png' | url }}">

{% endblock %}
