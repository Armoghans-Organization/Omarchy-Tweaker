
services:
  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    networks:
      - omniroute-internal

    volumes:
      - ./redis:/data

    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning

    init: true
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # OmniRoute
  # ==========================================
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped

    network_mode: host

    stop_grace_period: 40s

    env_file:
      - .env

    environment:
      # Persistent application data
      DATA_DIR: /app/data

      # Redis through host loopback
      REDIS_URL: redis://127.0.0.1:6379

      # Main API/server
      PORT: ${API_PORT:-6905}

      # Separate dashboard
      DASHBOARD_PORT: ${DASHBOARD_PORT:-6904}

      # Live WebSocket
      LIVE_WS_PORT: ${LIVE_WS_PORT:-6906}
      LIVE_WS_HOST: 127.0.0.1

      # Bind main application to loopback
      HOSTNAME: 127.0.0.1

      # ======================================
      # Automatic host CLI discovery
      # ======================================
      CLI_MODE: auto

      CLI_EXTRA_PATHS: "/host-node/bin:/usr/local/bin:/host-local/bin"

      CLI_CONFIG_HOME: /home/node
      CLI_ALLOW_CONFIG_WRITES: "true"

    volumes:
      - ./data:/app/data

    depends_on:
      redis:
        condition: service_healthy

    init: true
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==========================================
# Networks
# ==========================================
networks:
  omniroute-internal:
    name: omniroute-internal
    driver: bridge
