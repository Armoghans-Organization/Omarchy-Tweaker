services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped

    network_mode: host

    environment:
      - PORT=${PORT:?set PORT in .env}

    volumes:
      - ${HOME}/Projects/Containers/dockhand/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    init: true
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
